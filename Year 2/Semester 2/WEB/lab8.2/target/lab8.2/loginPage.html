<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<main class="login-box">
    <h1>Login</h1>
    <form action="login" method="POST">
        <label>Username</label>
        <input type="text" name="username" autocomplete="off" required minlength="3">

        <label>Password</label>
        <input type="password" name="password" autocomplete="off" required minlength="3">

        <input type="submit" value="Submit">
    </form>
</main>
</body>
</html>
